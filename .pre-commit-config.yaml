repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-check
        name: run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: check-imports
        name: Check Missing Imports (Production)
        entry: python scripts/check_imports.py src scripts --req requirements.in
        language: system
        pass_filenames: false
      - id: check-imports-dev
        name: Check Missing Imports (Development)
        entry: python scripts/check_imports.py tests --req requirements.in --req requirements-dev.in
        language: system
        pass_filenames: false
