# MCP Servers 設定範本
# 複製此檔為 mcp_config.yaml 並填入你的設定：
#   cp mcp_config.example.yaml mcp_config.yaml
#
# mcp_config.yaml 已加入 .gitignore，不會被 commit（保護你的 server 位址和 key）
#
# inject：自動注入到工具呼叫的參數，模型看不到也不需要填寫。
# 適合用於 api_key、auth_token 等認證參數。

servers:
  # 範例：本機檔案系統（stdio transport）
  # filesystem:
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

  # 範例：需要認證的 MCP server（inject 自動帶入 api_key）
  # mssql:
  #   transport: stdio
  #   command: python
  #   args: ["C:\\path\\to\\server.py"]
  #   inject:
  #     api_key: your-secret-key-here

  # 範例：遠端 SSE server
  # my-remote:
  #   transport: sse
  #   url: http://localhost:3001/sse

  # 範例：遠端 Streamable HTTP server（原生支援 MCP OAuth 2.1 自動瀏覽器授權或自訂 headers）
  # agensi:
  #   transport: Streamable HTTP
  #   url: https://mcp.agensi.io/mcp/auth
  #   # 選填：若伺服器改用靜態 Bearer Token 或自訂 Header，可透過 headers 或 env 設定
  #   # headers:
  #   #   Authorization: "Bearer ${AGENSI_TOKEN}"
  #   # env:
  #   #   AGENSI_TOKEN: ""
  #   # 常用唯讀工具免確認（寫入、上傳、提交與執行付費工具 run_tool 不應列入）
  #   safe_read_tools:
  #     - mcp__agensi__search_skills
  #     - mcp__agensi__get_skill
  #     - mcp__agensi__list_categories
  #     - mcp__agensi__get_popular
  #     - mcp__agensi__get_creator
  #     - mcp__agensi__get_skill_requests
  #     - mcp__agensi__find_tools
  #     - mcp__agensi__skill_tools
  #     - mcp__agensi__my_library
  #     - mcp__agensi__my_skills
  #     - mcp__agensi__my_credits
  #     - mcp__agensi__creator_status
  #     - mcp__agensi__quote_tool
  #     - mcp__agensi__quote_status
  #     - mcp__agensi__check_job
  #     - mcp__agensi__read_result

  # 瀏覽器操作（純 Python，用系統已裝的 Edge/Chrome，不需要 Node.js）
  # 進階：設 BROWSER_CDP_URL 可連既有瀏覽器保留登入狀態，見 browser_mcp.py 註解
  # browser:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/browser_mcp.py"]
  #    env:
  #      BROWSER_CDP_URL: 'http://localhost:9222'  # 告訴 MCP 直接連接已經在背景跑著的瀏覽器
  #      BROWSER_HEADLESS: "0"                     # 1：強制無頭模式

  # GitHub 整合（提供 PR 與 Issue 查詢、留言新增；GITHUB_TOKEN 留空或省略時將於執行時隱藏詢問）
  # github:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/github_mcp.py"]
  #   # is_sensitive: true                  # 選填：存取機密私有儲存庫時可設為 true，強制對話紀錄零落盤
  #   safe_read_tools:
  #     - github_list_prs
  #     - github_read_issue
  #   env:
  #     GITHUB_TOKEN: ""                    # 選填：Personal Access Token（建議留空，於對話執行時安全輸入）
  #     GITHUB_ALLOWED_REPOS: ""            # 選填：允許存取之 owner/repo 白名單（逗號分隔，如 "org/repo1,org/repo2"）

  # 本機 SQLite 資料庫檢索 (唯讀 SELECT 查詢)
  # 對話中可請 AI 切換資料庫，或輸入 /mcp sqlite <路徑> 直接切換
  # sqlite_switch_database 列入 safe_read_tools 時，僅工作區內路徑免確認；工作區外仍會詢問，UNC 網路路徑一律拒絕
  # sqlite:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/sqlite_mcp.py"]
  #   safe_read_tools:
  #     - sqlite_list_tables
  #     - sqlite_describe_schema
  #     - sqlite_run_select_query
  #     - sqlite_switch_database
  #   env:
  #     DB_PATH: "dev.db" # 選填：SQLite 資料庫完整路徑與檔名（留空、null 或省略時將於執行時詢問）

  # 遠端 MySQL / MariaDB 資料庫唯讀檢索（需安裝 pymysql 或 mysql-connector-python；未設定項將於執行時動態詢問）
  # mysql:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/mysql_mcp.py"]
  #   safe_read_tools:
  #     - mysql_list_databases
  #     - mysql_list_tables
  #     - mysql_describe_schema
  #     - mysql_run_select_query
  #   env:
  #     MYSQL_HOST: ""            # 選填：MySQL/MariaDB 主機 IP 或位址（留空、null 或省略時將於執行時詢問）
  #     MYSQL_PORT: "3306"        # 選填：連接埠，預設 3306（留空、null 或省略時將於執行時詢問）
  #     MYSQL_USER: ""            # 選填：登入帳號（留空、null 或省略時將於執行時詢問）
  #     MYSQL_PASSWORD: ""        # 選填：登入密碼（建議留空或省略，於執行時安全輸入）
  #     MYSQL_DATABASE: ""        # 選填：預設資料庫名稱（留空時可直接查詢伺服器上所有資料庫清單或跨庫查詢）
  #     MYSQL_CONNECT_TIMEOUT: "10"

  # 遠端 Microsoft SQL Server (MSSQL) 資料庫唯讀檢索（需安裝 pymssql 或 pyodbc；未設定項將於執行時動態詢問）
  # mssql:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/mssql_mcp.py"]
  #   safe_read_tools:
  #     - mssql_list_databases
  #     - mssql_list_tables
  #     - mssql_describe_schema
  #     - mssql_run_select_query
  #   env:
  #     MSSQL_HOST: ""            # 選填：SQL Server 主機 IP 或位址（留空、null 或省略時將於執行時詢問）
  #     MSSQL_PORT: "1433"        # 選填：連接埠，預設 1433（留空、null 或省略時將於執行時詢問）
  #     MSSQL_USER: ""            # 選填：登入帳號（留空、null 或省略時將於執行時詢問）
  #     MSSQL_PASSWORD: ""        # 選填：登入密碼（建議留空或省略，於執行時安全輸入）
  #     MSSQL_DATABASE: ""        # 選填：預設資料庫名稱（留空時預設連線登入帳號之預設資料庫並支援列出所有資料庫）
  #     MSSQL_CONNECT_TIMEOUT: "10"

  # 長期記憶與上下文管理 (預設存於 ~/.pocket-agent/memory.json)
  # memory:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/memory_mcp.py"]

  # 遠端 RHEL 主機唯讀探查與維運診斷（支援 SSH 金鑰與帳密雙軌驗證；env 內各項皆可預填、留空或省略，未設定項將於執行時在終端機動態詢問）
