  #     WIN_RDP_PORT: ""                     # 選填：RDP 連接埠，預設 3389（留空或省略時將於執行時詢問）
  #     WIN_RDP_USER: ""                     # 選填：Windows 登入帳號（支援 User、Domain\User 或 User@Domain）
  #     WIN_RDP_PASSWORD: ""                 # 選填：Windows 登入密碼（建議留空或省略，於執行時安全輸入）
