  #     RHEL_SSH_KEY_PATH: ""                # 選填：SSH 私鑰檔案路徑（設定時優先啟用金鑰認證；留空則自動使用帳密模式）
  #     RHEL_SSH_KEY_PASSPHRASE: ""          # 選填：私鑰解鎖密碼（若私鑰有設 Passphrase，建議留空於執行時安全輸入）
  #     RHEL_SSH_PASSWORD: ""                # 選填：SSH 登入密碼（使用帳密模式時建議留空或省略，於執行時安全輸入）
