# MCP Servers 設定範本
# 複製此檔為 mcp_config.yaml 並填入你的設定：
#   cp mcp_config.example.yaml mcp_config.yaml
#
# mcp_config.yaml 已加入 .gitignore，不會被 commit（保護你的 server 位址和 key）
#
# inject：自動注入到工具呼叫的參數，模型看不到也不需要填寫。
# 適合用於 api_key、auth_token 等認證參數。

servers:
  # 範例：本機檔案系統（stdio transport）
  # filesystem:
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

  # 範例：需要認證的 MCP server（inject 自動帶入 api_key）
  # mssql:
  #   transport: stdio
  #   command: python
  #   args: ["C:\\path\\to\\server.py"]
  #   inject:
  #     api_key: your-secret-key-here

  # 範例：遠端 SSE server
  # my-remote:
  #   transport: sse
  #   url: http://localhost:3001/sse

  # 瀏覽器操作（純 Python，用系統已裝的 Edge/Chrome，不需要 Node.js）
  # 進階：設 BROWSER_CDP_URL 可連既有瀏覽器保留登入狀態，見 browser_mcp.py 註解
  # browser:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/browser_mcp.py"]
  #    env:
  #      BROWSER_CDP_URL: 'http://localhost:9222'  # 告訴 MCP 直接連接已經在背景跑著的瀏覽器
  #      BROWSER_HEADLESS: "0"                     # 1：強制無頭模式

  # GitHub 整合 (提供 PR 與 Issue 查詢)
  # github:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/github_mcp.py"]
  #   env:
  #     GITHUB_TOKEN: "your_github_personal_access_token"

  # 本機資料庫檢索 (唯讀 SELECT 查詢)
  # database:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/database_mcp.py"]
  #   env:
  #     DB_PATH: "dev.db"

  # 長期記憶與上下文管理 (預設存於 ~/.pocket-agent/memory.json)
  # memory:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/memory_mcp.py"]

  # 遠端 RHEL 主機唯讀探查與維運診斷 (僅限帳號密碼驗證；env 內各項皆可預填、留空或省略，未設定項將於執行時在終端機動態詢問)
  # rhel_ops:
  #   transport: stdio
  #   command: python
  #   args: ["mcp_servers/rhel_mcp.py"]
  #   safe_read_tools:
  #     - rhel_system_overview
  #     - rhel_storage_and_fs
  #     - rhel_network_status
  #     - rhel_service_status
  #     - rhel_query_journal
  #     - rhel_security_status
  #     - rhel_read_config
  #   env:
  #     RHEL_HOST: ""                        # 選填：主機 IP 或位址（留空或省略時將於執行時詢問）
  #     RHEL_SSH_PORT: ""                    # 選填：SSH 連接埠（留空或省略時將於執行時詢問）
  #     RHEL_SSH_USER: ""                    # 選填：SSH 登入帳號（留空或省略時將於執行時詢問）
  #     RHEL_SSH_PASSWORD: ""                # 選填：SSH 登入密碼（建議留空或省略，於執行時安全輸入）
  #     RHEL_CONNECT_TIMEOUT: "10"
